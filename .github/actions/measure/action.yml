name: perfkit measure
description: >-
  에뮬레이터를 띄워 시나리오를 N회 측정하고 current.json 형식으로 집계한다.
  perf-reusable.yml 의 1차 측정(measure)과 재측정(remeasure) job 이 같이 쓴다.
  호출하는 job 은 앱 repo 를 워크스페이스 루트에, perfkit 을 _perfkit/ 에 체크아웃해 둬야 한다.

inputs:
  scenarios:
    description: '쉼표로 구분한 시나리오 (비면 perf.yaml 의 전체)'
    default: ''
  repeats:
    description: '반복 측정 횟수 (비면 perf.yaml)'
    default: ''
  env-file:
    description: 'assets/env/{dev,prod}.env 내용 (perf-reusable.yml 의 env_file 시크릿)'
    default: ''
  runs-dir:
    description: '반복별 원본 결과를 쓸 디렉터리'
    default: runs
  out:
    description: '집계 결과 파일'
    default: current.json

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - shell: bash
      run: pip install pyyaml

    # 호출한 앱이 flutter_dotenv 로 assets/env/*.env 를 읽는 경우, pubspec.yaml 이
    # 그 파일을 asset 으로 선언하고 있으면 없을 때 `flutter pub get`/build 자체가
    # 깨진다 — 그래서 pub get 보다 먼저 써야 한다. env-file 이 비어 있으면
    # (dotenv 를 안 쓰는 앱) 조용히 건너뛴다.
    - name: Create env asset files
      shell: bash
      env:
        ENV_FILE: ${{ inputs.env-file }}
      run: |
        if [ -z "$ENV_FILE" ]; then
          exit 0
        fi
        mkdir -p assets/env
        printf '%s\n' "$ENV_FILE" > assets/env/dev.env
        cp assets/env/dev.env assets/env/prod.env

    # 표준 Flutter 서명 관례(android/key.properties + android/app/build.gradle(.kts)
    # 의 keystoreProperties)를 쓰는 앱은, release build type 설정이 Gradle 설정
    # 단계에서 항상(요청한 variant 와 무관하게) 평가돼서 key.properties 가 없으면
    # `flutter drive --profile` 까지도 즉시 실패한다 — 실제 배포 키를 CI 에 둘 수는
    # 없으니, 측정에만 쓰고 버릴 자체 서명 키스토어를 만들어 채워준다.
    - name: Create throwaway keystore for profile build
      shell: bash
      run: |
        if [ -f android/key.properties ]; then
          exit 0
        fi
        keytool -genkeypair -v \
          -keystore android/app/perfkit-throwaway.jks \
          -storepass perfkit-throwaway -keypass perfkit-throwaway \
          -alias perfkit -keyalg RSA -keysize 2048 -validity 3650 \
          -dname "CN=perfkit, OU=CI, O=CI, L=CI, S=CI, C=US"
        cat > android/key.properties <<EOF
        storePassword=perfkit-throwaway
        keyPassword=perfkit-throwaway
        keyAlias=perfkit
        storeFile=perfkit-throwaway.jks
        EOF

    - shell: bash
      run: flutter pub get

    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # 측정. 러너 성능 편차를 줄이려고 같은 세션에서 N회 반복한다 (docs/DESIGN.md §6.2).
    - name: Measure
      uses: reactivecircus/android-emulator-runner@v2
      env:
        PERF_SCENARIOS: ${{ inputs.scenarios }}
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
        # reactivecircus/android-emulator-runner 는 script 의 각 줄을 별도 `sh -c` 로
        # 실행한다 — 줄 끝 `\` 로 이어붙이면 다음 줄과 합쳐지지 않고 `\` 가 그대로
        # 별도 인자로 파이썬에 전달돼 매번 터진다. 반드시 한 줄로 써야 한다.
        script: |
          export PERF_DEVICE=$(adb devices | awk 'NR==2{print $1}')
          PYTHONPATH=_perfkit/tool python -m perfkit run --out ${{ inputs.runs-dir }} ${{ inputs.repeats && format('--repeats {0}', inputs.repeats) || '' }} ${PERF_SCENARIOS:+--scenarios "$PERF_SCENARIOS"}

    - name: Aggregate
      shell: bash
      env:
        SCENARIOS: ${{ inputs.scenarios }}
      run: PYTHONPATH=_perfkit/tool python -m perfkit aggregate --runs "${{ inputs.runs-dir }}" --out "${{ inputs.out }}" --scenarios "$SCENARIOS"
