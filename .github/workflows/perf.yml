name: perf

# 이 repo 자신의 CI 트리거. 실제 로직은 perf-reusable.yml 에 있고 여기선 그걸 부른다.
# 다른 repo 에서 재사용하려면 이 파일을 그대로 복사해서 `uses:` 줄만
# `aiden30015/Ci-App-Performance-Measurement/.github/workflows/perf-reusable.yml@main`
# 로 바꾸면 된다 (로컬 상대경로 `./...` 는 같은 repo 안에서만 쓸 수 있다).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebaseline:
        description: '현재 측정값으로 baseline 을 갱신하는 PR 생성'
        type: boolean
        default: false
      repeats:
        description: '반복 측정 횟수 (기본값은 perf.yaml)'
        default: ''

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  perf:
    uses: ./.github/workflows/perf-reusable.yml
    with:
      rebaseline: ${{ inputs.rebaseline == true }}
      repeats: ${{ inputs.repeats || '' }}
    secrets: inherit
