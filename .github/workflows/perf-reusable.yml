name: perfkit (reusable)

# 다른 repo 가 uses: aiden30015/Ci-App-Performance-Measurement/.github/workflows/perf-reusable.yml@main
# 로 불러 쓰는 본체. 이 repo 자신도 perf.yml 에서 이걸 그대로 호출한다 (self-call) —
# 그래서 이 repo 의 CI 가 계속 통과하는 것 자체가 "다른 repo 에서도 통할까"의 회귀 테스트다.
#
# 호출하는 repo 에 필요한 것: perf.yaml, integration_test/perf_test.dart,
# lib/(앱 코드), baseline/performance_baseline.json(있으면). perfkit 도구·driver·
# dashboard 는 여기서만 관리하고 _perfkit/ 로 체크아웃해서 쓴다 — 그래서 오늘 같은
# 버그를 고치면 이 repo 하나만 고치면 이 workflow 를 쓰는 모든 repo 에 바로 반영된다.
on:
  workflow_call:
    inputs:
      perfkit-ref:
        description: 'perfkit 자체(tool/driver/dashboard) 버전. 팀 프로젝트라면 main 대신 태그 고정을 권장'
        type: string
        default: main
      rebaseline:
        description: '현재 측정값으로 baseline 을 갱신해 이 브랜치에 커밋'
        type: boolean
        default: false
      repeats:
        description: '반복 측정 횟수 (기본값은 호출한 repo 의 perf.yaml)'
        type: string
        default: ''
      scenarios:
        description: >-
          쉼표로 구분한 시나리오만 측정 (예: 'home_scroll,login'). 비우면 아래
          select-changed 규칙을 따르고, 그것도 아니면 perf.yaml 의 전체를 측정한다.
          일부만 측정한 결과는 baseline 으로 쓸 수 없어 rebaseline 과 같이 못 쓴다.
        type: string
        default: ''
      select-changed:
        description: >-
          true 면 pull_request 에서 변경된 파일로 돌릴 시나리오를 고른다
          (perf.yaml 의 selection 참고). 성능과 무관한 변경뿐이면 측정을 건너뛴다.
          push/수동 실행은 항상 전체(또는 scenarios 입력)를 측정한다.
        type: boolean
        default: false
      history-refs:
        description: >-
          push 이벤트에서 perf-history 를 쌓고 대시보드를 갱신할 브랜치 목록
          (JSON 배열 문자열, 예: '["main","develop"]'). 여기 없는 브랜치로
          push 돼도 PR 게이트(회귀 검사)는 그대로 동작하고, 히스토리 적재·
          대시보드 갱신만 건너뛴다.
        type: string
        default: '["main"]'
      baseline-runners:
        description: >-
          rebaseline 때 측정할 러너 수. 러너마다 새 VM + 새 에뮬레이터에서 repeats 회씩 재고
          모든 표본을 합쳐 baseline 을 만든다. 그래야 noise 에 러너 간 편차가 들어가서
          σ 게이트가 실제 CI 편차를 알게 된다 (DESIGN §6.8). 1 이면 기존처럼 한 대만 쓴다.
        type: string
        default: '5'
      retry-on-regression:
        description: >-
          true 면 회귀(또는 결과 없음)가 난 시나리오만 새 러너에서 한 번 더 측정하고,
          재측정에서도 기준을 넘을 때만 실패로 본다. CI 러너마다 실행 전체가 느려지는
          편차를 코드 회귀로 오판하지 않기 위한 것 (DESIGN §6.7). 실패 시 시간이 그만큼 더 든다.
        type: boolean
        default: true
    secrets:
      env_file:
        description: >-
          호출한 앱이 flutter_dotenv 로 읽는 assets/env/{dev,prod}.env 내용
          (KEY=VALUE, 줄바꿈으로 구분). 비어 있으면 이 스텝은 건너뛴다 — 앱이
          dotenv 를 안 쓰면 그냥 두면 된다. GOMS_API_BASE_URL 같은 실제 백엔드
          시크릿과 TEST_EMAIL/TEST_PASSWORD 처럼 시나리오가 로그인에 쓰는 계정
          정보를 한 번에 몰아 넣는 용도.
        required: false
    outputs:
      regressed:
        description: '이번 실행에서 회귀가 감지됐는지'
        value: ${{ jobs.perf.outputs.regressed }}

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 무엇을 잴지 정하는 가벼운 job. 에뮬레이터(12~15분)를 띄우기 전에 끝난다.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scenarios: ${{ steps.pick.outputs.scenarios }}
      skip: ${{ steps.pick.outputs.skip }}
      note: ${{ steps.pick.outputs.note }}
      baseline_shards: ${{ steps.shards.outputs.list }}
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout perfkit
        uses: actions/checkout@v4
        with:
          repository: aiden30015/Ci-App-Performance-Measurement
          ref: ${{ inputs.perfkit-ref }}
          path: _perfkit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - id: pick
        env:
          MANUAL: ${{ inputs.scenarios }}
          SELECT_CHANGED: ${{ inputs.select-changed }}
          REBASELINE: ${{ inputs.rebaseline }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$MANUAL" ]; then
            if [ "$REBASELINE" = "true" ]; then
              echo "::error::일부 시나리오만 측정한 결과로는 baseline 을 갱신할 수 없습니다 (scenarios 를 비우세요)."
              exit 1
            fi
            {
              echo "scenarios=$MANUAL"
              echo "skip=false"
              echo "note=수동으로 지정한 시나리오만 측정"
            } >> "$GITHUB_OUTPUT"
          elif [ "$SELECT_CHANGED" = "true" ] && [ "$EVENT" = "pull_request" ]; then
            PYTHONPATH=_perfkit/tool python -m perfkit select --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            {
              echo "scenarios="
              echo "skip=false"
              echo "note="
            } >> "$GITHUB_OUTPUT"
          fi
      # rebaseline 이면 1차 measure 러너 말고 추가로 띄울 러너 번호 목록 (2..N).
      - id: shards
        env:
          REBASELINE: ${{ inputs.rebaseline }}
          RUNNERS: ${{ inputs.baseline-runners }}
        run: |
          if [ "$REBASELINE" = "true" ] && [ "${RUNNERS:-1}" -gt 1 ]; then
            echo "list=[$(seq -s, 2 "$RUNNERS")]" >> "$GITHUB_OUTPUT"
          else
            echo "list=[]" >> "$GITHUB_OUTPUT"
          fi

  # 1차 측정. 회귀가 나면 그 시나리오 목록만 output 으로 넘긴다 — 판정·리포트·기록은
  # 재측정까지 끝난 뒤 perf job 이 한 번만 한다 (DESIGN §6.7).
  measure:
    needs: select
    if: needs.select.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      # rebaseline 은 어차피 이번 값으로 기준을 새로 뜨므로 재측정하지 않는다.
      retry: ${{ inputs.retry-on-regression && !inputs.rebaseline && steps.check.outputs.retry_scenarios || '' }}
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      # 도구·driver·dashboard 는 항상 이 repo(perfkit) 에서 가져온다. 서브디렉터리로
      # 체크아웃하므로 호출한 repo 의 파일과 절대 섞이지 않는다.
      - name: Checkout perfkit
        uses: actions/checkout@v4
        with:
          repository: aiden30015/Ci-App-Performance-Measurement
          ref: ${{ inputs.perfkit-ref }}
          path: _perfkit

      - uses: ./_perfkit/.github/actions/measure
        with:
          scenarios: ${{ needs.select.outputs.scenarios }}
          repeats: ${{ inputs.repeats }}
          env-file: ${{ secrets.env_file }}

      - name: Check against baseline
        id: check
        continue-on-error: true
        env:
          SCENARIOS: ${{ needs.select.outputs.scenarios }}
        run: |
          PYTHONPATH=_perfkit/tool python -m perfkit check \
            --current current.json --out perf_report.md --rows-out perf_rows.json \
            --scenarios "$SCENARIOS"

      - uses: actions/upload-artifact@v4
        with:
          name: perf-measure
          path: |
            runs/
            current.json
            perf_rows.json
            perf_report.md
          retention-days: 30
          overwrite: true

  # 회귀가 난 시나리오만 새 러너(새 VM + 새 에뮬레이터)에서 다시 잰다.
  # 같은 러너에서 에뮬레이터만 다시 띄우지 않는 이유: 실측상 "실행 전체가 느려지는"
  # 편차는 모든 시나리오와 startup 까지 같이 느려지는 모양이라 호스트(러너) 쪽 원인으로
  # 보인다. 같은 머신에서 다시 재면 같은 편차를 다시 잴 가능성이 크다.
  remeasure:
    needs: [select, measure]
    if: needs.measure.outputs.retry != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
      - name: Checkout perfkit
        uses: actions/checkout@v4
        with:
          repository: aiden30015/Ci-App-Performance-Measurement
          ref: ${{ inputs.perfkit-ref }}
          path: _perfkit

      - uses: ./_perfkit/.github/actions/measure
        with:
          scenarios: ${{ needs.measure.outputs.retry }}
          repeats: ${{ inputs.repeats }}
          env-file: ${{ secrets.env_file }}
          runs-dir: runs-retry
          out: retry.json

      - uses: actions/upload-artifact@v4
        with:
          name: perf-remeasure
          path: |
            runs-retry/
            retry.json
          retention-days: 30
          overwrite: true

  # rebaseline 전용: 러너를 더 띄워 같은 커밋을 잰다. perf job 이 1차 measure 결과와
  # 합쳐서 baseline 을 만든다 (DESIGN §6.8).
  baseline-runners:
    needs: select
    if: needs.select.outputs.baseline_shards != '[]' && needs.select.outputs.baseline_shards != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.baseline_shards) }}
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
      - name: Checkout perfkit
        uses: actions/checkout@v4
        with:
          repository: aiden30015/Ci-App-Performance-Measurement
          ref: ${{ inputs.perfkit-ref }}
          path: _perfkit

      - uses: ./_perfkit/.github/actions/measure
        with:
          repeats: ${{ inputs.repeats }}
          env-file: ${{ secrets.env_file }}

      - uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-${{ matrix.shard }}
          path: runs/
          retention-days: 30
          overwrite: true

  # 최종 판정·리포트·기록. 재측정을 했으면 그 시나리오는 재측정 값으로 판정한다.
  # job 이름을 perf 로 유지해서 호출한 repo 의 체크 이름(`perf / perf`)이 바뀌지 않게 한다.
  perf:
    needs: [select, measure, remeasure, baseline-runners]
    # remeasure 가 skip 돼도 돌아야 하고, measure 가 깨졌을 때도 돌아서 빨갛게 끝나야 한다
    # (skip 으로 끝나면 필수 체크가 통과로 취급된다). 다만 run 자체가 취소됐을 때는
    # 돌지 않는다 — 새 커밋 push 로 취소된 run 이 PR 에 실패로 찍히지 않게.
    if: "!cancelled() && needs.select.result == 'success' && needs.select.outputs.skip != 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      regressed: ${{ steps.check.outcome == 'failure' }}
    steps:
      - name: Measurement must have succeeded
        if: needs.measure.result != 'success'
        run: |
          echo '::error::측정(measure) job 이 실패했습니다. 그 job 의 로그를 확인하세요.'
          exit 1

      - name: Checkout app repo
        uses: actions/checkout@v4
      - name: Checkout perfkit
        uses: actions/checkout@v4
        with:
          repository: aiden30015/Ci-App-Performance-Measurement
          ref: ${{ inputs.perfkit-ref }}
          path: _perfkit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml

      - uses: actions/download-artifact@v4
        with:
          name: perf-measure
          path: attempt1
      - uses: actions/download-artifact@v4
        if: needs.remeasure.result == 'success'
        with:
          name: perf-remeasure
          path: attempt2

      # 재측정이 깨졌으면 1차 값으로 판정한다 — 재측정 실패로 회귀를 덮지 않는다.
      - name: Merge remeasured scenarios
        id: merge
        env:
          REMEASURE: ${{ needs.remeasure.result }}
        run: |
          if [ -f attempt2/retry.json ]; then
            PYTHONPATH=_perfkit/tool python -m perfkit merge \
              --current attempt1/current.json --retry attempt2/retry.json --out current.json
            echo "args=--first-rows attempt1/perf_rows.json" >> "$GITHUB_OUTPUT"
          else
            cp attempt1/current.json current.json
            if [ "$REMEASURE" = "failure" ]; then
              echo "note=재측정 job 이 실패해 1차 측정값으로 판정했습니다." >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Check against baseline
        id: check
        continue-on-error: true
        env:
          SCENARIOS: ${{ needs.select.outputs.scenarios }}
          SELECT_NOTE: ${{ needs.select.outputs.note }}
          MERGE_NOTE: ${{ steps.merge.outputs.note }}
        run: |
          PYTHONPATH=_perfkit/tool python -m perfkit check \
            --current current.json \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out perf_report.md --rows-out perf_rows.json \
            --scenarios "$SCENARIOS" --note "${SELECT_NOTE}${MERGE_NOTE:+ ${MERGE_NOTE}}" \
            ${{ steps.merge.outputs.args }}

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat perf_report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body-file perf_report.md --edit-last --create-if-none
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-raw-${{ github.run_id }}
          path: |
            attempt1/
            attempt2/
            current.json
            perf_rows.json
            perf_report.md
          retention-days: 30
          overwrite: true

      # ---- history-refs 에 오른 브랜치에 머지된 결과만 장기 히스토리에 쌓는다
      # (그 외 브랜치/PR 측정값은 상태가 불안정해 추세를 오염시킨다).
      - name: Append history
        if: contains(fromJSON(inputs.history-refs), github.ref_name) && github.event_name == 'push'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin perf-history || true
          git worktree add ../history perf-history 2>/dev/null \
            || git worktree add --orphan -b perf-history ../history
          PYTHONPATH=_perfkit/tool python -m perfkit store \
            --current current.json --rows perf_rows.json --out ../history \
            --commit "${{ github.sha }}" --branch "${{ github.ref_name }}" --run-id "${{ github.run_id }}"
          cd ../history
          git add -A && git commit -m "perf: run ${{ github.run_id }} (${{ github.sha }})" && git push origin perf-history

      - name: Build dashboard
        if: contains(fromJSON(inputs.history-refs), github.ref_name) && github.event_name == 'push'
        run: PYTHONPATH=_perfkit/tool python -m perfkit dashboard --data ../history --out site
      - uses: actions/upload-pages-artifact@v3
        if: contains(fromJSON(inputs.history-refs), github.ref_name) && github.event_name == 'push'
        with:
          path: site

      # ---- 수동 rebaseline: 실행한 브랜치에 커밋하고 그 PR 에 알린다 (DESIGN §6.4).
      - uses: actions/download-artifact@v4
        if: inputs.rebaseline && needs.baseline-runners.result != 'skipped'
        with:
          pattern: perf-baseline-*
          path: extra

      # 러너마다 잰 표본을 전부 합쳐 baseline 을 만든다 (DESIGN §6.8). 추가 러너 일부가
      # 깨졌으면 모인 것만으로 만들고 PR 본문에 몇 대였는지 남긴다.
      - name: Pool runners
        id: pool
        if: inputs.rebaseline
        env:
          WANTED: ${{ inputs.baseline-runners }}
        run: |
          runs=(attempt1/runs)
          for d in extra/*/; do
            [ -d "$d" ] && runs+=("${d%/}")
          done
          PYTHONPATH=_perfkit/tool python -m perfkit aggregate --runs "${runs[@]}" --out pooled.json
          echo "count=${#runs[@]}" >> "$GITHUB_OUTPUT"
          if [ "${#runs[@]}" -lt "${WANTED:-1}" ]; then
            echo "::warning::baseline 러너 ${WANTED}대 중 ${#runs[@]}대 결과만 모였습니다."
          fi

      # 새 PR 을 만들지 않고 rebaseline 을 돌린 브랜치에 바로 커밋한다. 보통 작업 중인 PR
      # 브랜치에서 돌리므로, 그 PR 에 baseline 이 바뀌었다는 코멘트를 남겨 리뷰어가 알게 한다.
      # 기본 브랜치에서 돌렸을 때만 리뷰 없이 들어가지 않도록 별도 브랜치로 올린다.
      - name: Rebaseline
        if: inputs.rebaseline
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNERS: ${{ steps.pool.outputs.count }}
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          PYTHONPATH=_perfkit/tool python -m perfkit rebaseline \
            --current pooled.json --commit "${{ github.sha }}" | tee rebaseline.log
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add baseline/performance_baseline.json
          git commit -m "perf: rebaseline (run ${{ github.run_id }}, 러너 ${RUNNERS}대)"
          if [ "$REF" = "$DEFAULT_BRANCH" ]; then
            target="perf/rebaseline-${{ github.run_id }}"
          else
            target="$REF"
          fi
          # 측정하는 사이 브랜치에 새 커밋이 올라왔으면 fast-forward 가 안 돼서 거부된다.
          # 그때는 덮어쓰지 않고 실패로 알린다 (최신 커밋에서 다시 돌리면 된다).
          git push origin "HEAD:refs/heads/$target"
          sha=$(git rev-parse --short HEAD)
          body=$(printf '### 📌 baseline 이 갱신되었습니다\n\nrun [%s](%s) 의 측정값(러너 %s대)으로 `baseline/performance_baseline.json` 을 갱신해 `%s` 에 커밋했습니다 (%s).\n\n```\n%s\n```\n' \
                   "${{ github.run_id }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                   "$RUNNERS" "$target" "$sha" "$(cat rebaseline.log)")
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          pr=$(gh pr list --head "$target" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "$body"
          fi

      - name: Fail on regression
        if: steps.check.outcome == 'failure'
        run: |
          echo '::error::성능 회귀가 감지되었습니다. Job Summary 의 리포트를 확인하세요.'
          exit 1

  deploy-dashboard:
    needs: perf
    # perf job 은 회귀가 감지되면 마지막 스텝에서 의도적으로 exit 1 해서 CI 를 빨갛게
    # 만든다. 그 실패 때문에 기본 success() 게이트에 걸려 deploy-dashboard 가 스킵되면,
    # 대시보드를 가장 갱신해야 할 순간(방금 회귀가 난 시점)에 정작 갱신이 안 된다.
    if: >
      always() &&
      needs.perf.result != 'cancelled' &&
      (needs.perf.result == 'success' || needs.perf.outputs.regressed == 'true') &&
      contains(fromJSON(inputs.history-refs), github.ref_name) && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
