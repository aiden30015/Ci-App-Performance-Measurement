name: perfkit (reusable)

# 다른 repo 가 uses: aiden30015/Ci-App-Performance-Measurement/.github/workflows/perf-reusable.yml@main
# 로 불러 쓰는 본체. 이 repo 자신도 perf.yml 에서 이걸 그대로 호출한다 (self-call) —
# 그래서 이 repo 의 CI 가 계속 통과하는 것 자체가 "다른 repo 에서도 통할까"의 회귀 테스트다.
#
# 호출하는 repo 에 필요한 것: perf.yaml, integration_test/perf_test.dart,
# lib/(앱 코드), baseline/performance_baseline.json(있으면). perfkit 도구·driver·
# dashboard 는 여기서만 관리하고 _perfkit/ 로 체크아웃해서 쓴다 — 그래서 오늘 같은
# 버그를 고치면 이 repo 하나만 고치면 이 workflow 를 쓰는 모든 repo 에 바로 반영된다.
on:
  workflow_call:
    inputs:
      perfkit-ref:
        description: 'perfkit 자체(tool/driver/dashboard) 버전. 팀 프로젝트라면 main 대신 태그 고정을 권장'
        type: string
        default: main
      rebaseline:
        description: '현재 측정값으로 baseline 을 갱신하는 PR 생성'
        type: boolean
        default: false
      repeats:
        description: '반복 측정 횟수 (기본값은 호출한 repo 의 perf.yaml)'
        type: string
        default: ''
      history-refs:
        description: >-
          push 이벤트에서 perf-history 를 쌓고 대시보드를 갱신할 브랜치 목록
          (JSON 배열 문자열, 예: '["main","develop"]'). 여기 없는 브랜치로
          push 돼도 PR 게이트(회귀 검사)는 그대로 동작하고, 히스토리 적재·
          대시보드 갱신만 건너뛴다.
        type: string
        default: '["main"]'
    secrets:
      env_file:
        description: >-
          호출한 앱이 flutter_dotenv 로 읽는 assets/env/{dev,prod}.env 내용
          (KEY=VALUE, 줄바꿈으로 구분). 비어 있으면 이 스텝은 건너뛴다 — 앱이
          dotenv 를 안 쓰면 그냥 두면 된다. GOMS_API_BASE_URL 같은 실제 백엔드
          시크릿과 TEST_EMAIL/TEST_PASSWORD 처럼 시나리오가 로그인에 쓰는 계정
          정보를 한 번에 몰아 넣는 용도.
        required: false
    outputs:
      regressed:
        description: '이번 실행에서 회귀가 감지됐는지'
        value: ${{ jobs.perf.outputs.regressed }}

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      regressed: ${{ steps.check.outcome == 'failure' }}
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      # 도구·driver·dashboard 는 항상 이 repo(perfkit) 에서 가져온다. 서브디렉터리로
      # 체크아웃하므로 호출한 repo 의 파일과 절대 섞이지 않는다.
      - name: Checkout perfkit
        uses: actions/checkout@v4
        with:
          repository: aiden30015/Ci-App-Performance-Measurement
          ref: ${{ inputs.perfkit-ref }}
          path: _perfkit

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml

      # 호출한 앱이 flutter_dotenv 로 assets/env/*.env 를 읽는 경우, pubspec.yaml 이
      # 그 파일을 asset 으로 선언하고 있으면 없을 때 `flutter pub get`/build 자체가
      # 깨진다 — 그래서 pub get 보다 먼저 써야 한다. env_file 시크릿이 비어 있으면
      # (dotenv 를 안 쓰는 앱) 조용히 건너뛴다.
      # `secrets` 컨텍스트는 `if:` 조건문에서 쓸 수 없다 (Unrecognized named-value:
      # 'secrets') — job/step 의 `env:`, `with:`, `run:` 에서만 참조 가능하다.
      # 그래서 스텝은 항상 실행하고, 비어있는지 판단은 셸 안에서 한다.
      - name: Create env asset files
        env:
          ENV_FILE: ${{ secrets.env_file }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            exit 0
          fi
          mkdir -p assets/env
          printf '%s\n' "$ENV_FILE" > assets/env/dev.env
          cp assets/env/dev.env assets/env/prod.env

      # 진단용: 값은 절대 출력하지 않고, 어떤 키가 실제로 파일에 들어갔는지만
      # (줄 수와 키 이름) 확인한다.
      - name: Debug env file keys
        run: |
          echo "line count: $(wc -l < assets/env/dev.env)"
          echo "keys: $(grep -o '^[A-Za-z_][A-Za-z0-9_]*=' assets/env/dev.env | tr -d '=' | tr '\n' ' ')"

      # 진단용: 이 러너에서 백엔드가 실제로 응답하는지 확인한다. URL 값 자체는
      # 출력하지 않는다(시크릿이라 어차피 마스킹되지만, 굳이 남길 필요도 없다).
      - name: Debug backend reachability
        run: |
          BASE_URL=$(grep -m1 '^GOMS_API_BASE_URL=' assets/env/dev.env 2>/dev/null | cut -d= -f2-)
          if [ -z "$BASE_URL" ]; then
            echo "GOMS_API_BASE_URL not present in env file"
            exit 0
          fi
          echo "Pinging backend (URL masked)..."
          curl -sS -o /dev/null -w 'HTTP %{http_code} in %{time_total}s (connect: %{time_connect}s)\n' --max-time 15 "$BASE_URL" || echo "curl exit code: $?"

      # 표준 Flutter 서명 관례(android/key.properties + android/app/build.gradle(.kts)
      # 의 keystoreProperties)를 쓰는 앱은, release build type 설정이 Gradle 설정
      # 단계에서 항상(요청한 variant 와 무관하게) 평가돼서 key.properties 가 없으면
      # `flutter drive --profile` 까지도 즉시 실패한다 — 실제 배포 키를 CI 에 둘 수는
      # 없으니, 측정에만 쓰고 버릴 자체 서명 키스토어를 만들어 채워준다.
      - name: Create throwaway keystore for profile build
        run: |
          if [ -f android/key.properties ]; then
            exit 0
          fi
          keytool -genkeypair -v \
            -keystore android/app/perfkit-throwaway.jks \
            -storepass perfkit-throwaway -keypass perfkit-throwaway \
            -alias perfkit -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=perfkit, OU=CI, O=CI, L=CI, S=CI, C=US"
          cat > android/key.properties <<EOF
          storePassword=perfkit-throwaway
          keyPassword=perfkit-throwaway
          keyAlias=perfkit
          storeFile=perfkit-throwaway.jks
          EOF

      - run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 측정. 러너 성능 편차를 줄이려고 같은 세션에서 N회 반복한다 (docs/DESIGN.md §6.2).
      - name: Measure
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          # reactivecircus/android-emulator-runner 는 script 의 각 줄을 별도 `sh -c` 로
          # 실행한다 — 줄 끝 `\` 로 이어붙이면 다음 줄과 합쳐지지 않고 `\` 가 그대로
          # 별도 인자로 파이썬에 전달돼 매번 터진다. 반드시 한 줄로 써야 한다.
          script: |
            export PERF_DEVICE=$(adb devices | awk 'NR==2{print $1}')
            PYTHONPATH=_perfkit/tool python -m perfkit run --out runs ${{ inputs.repeats && format('--repeats {0}', inputs.repeats) || '' }}

      - name: Aggregate
        run: PYTHONPATH=_perfkit/tool python -m perfkit aggregate --runs runs --out current.json

      - name: Check against baseline
        id: check
        continue-on-error: true
        run: |
          PYTHONPATH=_perfkit/tool python -m perfkit check \
            --current current.json \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out perf_report.md --rows-out perf_rows.json

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat perf_report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body-file perf_report.md --edit-last --create-if-none
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-raw-${{ github.run_id }}
          path: |
            runs/
            current.json
            perf_rows.json
            perf_report.md
          retention-days: 30

      # ---- history-refs 에 오른 브랜치에 머지된 결과만 장기 히스토리에 쌓는다
      # (그 외 브랜치/PR 측정값은 상태가 불안정해 추세를 오염시킨다).
      - name: Append history
        if: contains(fromJSON(inputs.history-refs), github.ref_name) && github.event_name == 'push'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin perf-history || true
          git worktree add ../history perf-history 2>/dev/null \
            || git worktree add --orphan -b perf-history ../history
          PYTHONPATH=_perfkit/tool python -m perfkit store \
            --current current.json --rows perf_rows.json --out ../history \
            --commit "${{ github.sha }}" --branch "${{ github.ref_name }}" --run-id "${{ github.run_id }}"
          cd ../history
          git add -A && git commit -m "perf: run ${{ github.run_id }} (${{ github.sha }})" && git push origin perf-history

      - name: Build dashboard
        if: contains(fromJSON(inputs.history-refs), github.ref_name) && github.event_name == 'push'
        run: PYTHONPATH=_perfkit/tool python -m perfkit dashboard --data ../history --out site
      - uses: actions/upload-pages-artifact@v3
        if: contains(fromJSON(inputs.history-refs), github.ref_name) && github.event_name == 'push'
        with:
          path: site

      # ---- 수동 rebaseline: 자동 커밋하지 않고 리뷰 가능한 PR 로 만든다 (DESIGN §6.4).
      - name: Rebaseline PR
        if: inputs.rebaseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=_perfkit/tool python -m perfkit rebaseline \
            --current current.json --commit "${{ github.sha }}" | tee rebaseline.log
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          branch="perf/rebaseline-${{ github.run_id }}"
          git checkout -b "$branch"
          git add baseline/performance_baseline.json
          git commit -m "perf: rebaseline from ${{ github.sha }}"
          git push origin "$branch"
          gh pr create --title "perf: rebaseline (run ${{ github.run_id }})" \
            --body "$(printf 'run %s 의 측정값으로 baseline 을 갱신합니다.\n\n```\n%s\n```\n' \
                      "${{ github.run_id }}" "$(cat rebaseline.log)")"

      - name: Fail on regression
        if: steps.check.outcome == 'failure'
        run: |
          echo '::error::성능 회귀가 감지되었습니다. Job Summary 의 리포트를 확인하세요.'
          exit 1

  deploy-dashboard:
    needs: perf
    # perf job 은 회귀가 감지되면 마지막 스텝에서 의도적으로 exit 1 해서 CI 를 빨갛게
    # 만든다. 그 실패 때문에 기본 success() 게이트에 걸려 deploy-dashboard 가 스킵되면,
    # 대시보드를 가장 갱신해야 할 순간(방금 회귀가 난 시점)에 정작 갱신이 안 된다.
    if: >
      always() &&
      needs.perf.result != 'cancelled' &&
      (needs.perf.result == 'success' || needs.perf.outputs.regressed == 'true') &&
      contains(fromJSON(inputs.history-refs), github.ref_name) && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
